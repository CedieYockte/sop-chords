<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#111318; --card:#181b22; --line:#272b35; --text:#eef0f4; --muted:#8a90a0; --dim:#5f6575; --gold:#f2c14e; --gold2:#ffd97a; }
  * { box-sizing: border-box; }
  html { max-height: 598px; }
  body { margin: 0; width: 370px; max-height: 598px; overflow-y: auto; background: radial-gradient(120% 60% at 50% -10%, #2a2312 0%, var(--bg) 55%); color: var(--text);
    font: 13px "Segoe UI", Roboto, system-ui, sans-serif; }
  button { font: inherit; color: inherit; border: none; cursor: pointer; }
  .hdr { display: flex; align-items: center; gap: 11px; padding: 10px 14px 8px; }
  .hdr img { width: 36px; height: 36px; border-radius: 10px; box-shadow: 0 4px 14px rgba(242,193,78,.25); }
  .hdr h1 { margin: 0; font-size: 17px; font-weight: 700; }
  .hdr .tag { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .hdr .badge { margin-left: auto; white-space: nowrap; font-size: 10.5px; font-weight: 700; letter-spacing: .6px; color: var(--gold);
    border: 1px solid #4a3f1f; background: #221d10; padding: 4px 9px; border-radius: 999px; }
  .card { margin: 0 12px 9px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; }
  .card.glow { border-color: #3d3420; box-shadow: inset 0 1px 0 rgba(255,217,122,.06); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: #1f232c; border-radius: 10px; padding: 7px 6px; text-align: center; }
  .stat b { display: block; font-size: 18px; color: var(--gold2); line-height: 1.1; }
  .stat span { color: var(--muted); font-size: 10.5px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .row + .row { border-top: 1px solid #22262f; }
  .ico { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 14px; flex: 0 0 auto; }
  .ico.a { background: #2b2414; color: var(--gold); } .ico.b { background: #142a26; color: #4fd1b5; } .ico.c { background: #221a2e; color: #b48cff; }
  .row .lbl { flex: 1; font-weight: 600; }
  .row .sub { display: block; color: var(--dim); font-size: 11px; font-weight: 400; }
  .sw { position: relative; width: 36px; height: 20px; flex: 0 0 auto; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw i { position: absolute; inset: 0; background: #333846; border-radius: 999px; transition: .2s; }
  .sw i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #cfd3dc; transition: .2s; }
  .sw input:checked + i { background: var(--gold); }
  .sw input:checked + i::after { left: 19px; background: #14161c; }
  .seg { display: flex; background: #1f232c; border-radius: 8px; padding: 2px; }
  .seg button { background: none; padding: 4px 10px; border-radius: 6px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .seg button.on { background: #333846; color: var(--text); }
  .ctx { text-align: center; padding: 13px 14px; }
  .ctx p { margin: 0 0 10px; color: #b5bac6; line-height: 1.5; }
  .ctx .title { font-weight: 700; font-size: 14px; color: var(--text); margin-bottom: 4px; text-align: left; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ctx .info { display: flex; gap: 6px; flex-wrap: wrap; margin: 7px 0 10px; justify-content: flex-start; }
  .pill { background: #1f232c; border: 1px solid #2c313d; border-radius: 999px; padding: 3px 8px; font-size: 11px; color: #c4c8d2; }
  .pill b { color: var(--gold); }
  .btn { background: #22262f; border: 1px solid #333846; border-radius: 10px; padding: 9px 16px; font-weight: 600; }
  .btn:hover { background: #2b303b; }
  .btn.primary { width: 100%; background: linear-gradient(90deg, #e9b23a, #f6cf6a); color: #17140a; border: none; font-weight: 700;
    box-shadow: 0 6px 18px rgba(242,193,78,.25); }
  .btn.primary:hover { filter: brightness(1.05); }
  .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #ff4d5e; margin-right: 5px; vertical-align: 1px; }
  h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: .8px; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; }
  h2 button { background: none; color: var(--dim); font-size: 11px; letter-spacing: 0; font-weight: 600; padding: 0; }
  h2 button:hover { color: #ffb4b4; }
  .song { display: flex; align-items: center; gap: 10px; padding: 4px 6px; border-radius: 8px; cursor: pointer; }
  .song:hover { background: #1f232c; }
  .song .k { flex: 0 0 auto; min-width: 40px; text-align: center; font-weight: 700; color: var(--gold); background: #221d10; border-radius: 7px; padding: 4px 4px; font-size: 12px; }
  .song .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song .n { color: var(--dim); font-size: 11px; flex: 0 0 auto; }
  .empty { color: var(--dim); font-size: 12px; padding: 4px 2px; }
  .links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 12px; }
  .links button { border-radius: 10px; padding: 8px 4px; font-weight: 700; font-size: 12.5px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .l1 { background: #221d10; border: 1px solid #4a3f1f; color: var(--gold2); }
  .l2 { background: #171a2c; border: 1px solid #2c3260; color: #aab4ff; }
  .l3 { background: #142a26; border: 1px solid #22524a; color: #7fe0c8; }
  .links button:hover { filter: brightness(1.15); }
  .foot { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; padding: 8px 14px 10px; }
  .foot a { color: var(--dim); text-decoration: none; } .foot a:hover { color: var(--text); }
  .toast { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: #2b303b; padding: 6px 12px; border-radius: 8px; font-size: 12px; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
  <div class="hdr">
    <img src="icons/icon48.png" alt="">
    <div><h1>SOP</h1><div class="tag">Live chords right on YouTube</div></div>
    <span class="badge">FREE</span>
  </div>

  <div class="card glow">
    <div class="stats">
      <div class="stat"><b id="sSongs">0</b><span>Songs charted</span></div>
      <div class="stat"><b id="sChords">0</b><span>Chords logged</span></div>
      <div class="stat"><b id="sKey">—</b><span>Top key</span></div>
    </div>
    <div style="margin-top:6px">
      <div class="row"><div class="ico a">♪</div><span class="lbl" title="Chord bar on top of the video">Chord panel on YouTube</span>
        <label class="sw"><input type="checkbox" id="enabled"><i></i></label></div>
      <div class="row"><div class="ico b">♫</div><span class="lbl" title="Practice mixer below the video">Practice mixer</span>
        <label class="sw"><input type="checkbox" id="diagrams"><i></i></label></div>
      <div class="row"><div class="ico c">♯</div><span class="lbl">Note spelling</span>
        <div class="seg" id="acc"><button data-v="auto">Auto</button><button data-v="sharp">♯</button><button data-v="flat">♭</button></div></div>
    </div>
  </div>

  <div class="card ctx" id="ctx"></div>

  <div class="card" style="padding:10px 8px 6px">
    <h2 style="padding:0 6px">RECENT SONGS <button id="clearAll" style="display:none">Clear all</button></h2>
    <div id="songs"><div class="empty">Songs you play with SOP will show here.</div></div>
  </div>

  <div class="links">
    <button class="l1" id="lGit">★ GitHub</button>
    <button class="l2" id="lHelp">? How to</button>
    <button class="l3" id="lShare">↗ Share</button>
  </div>
  <div class="foot"><a href="#" id="feedback">Something not working? Send feedback</a><span id="ver"></span></div>
  <div class="toast" id="toast"></div>
  <script src="sop-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
